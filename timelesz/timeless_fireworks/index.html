<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMENTUM</title>
    <style>
        /* 基礎重設與背景設計 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            color: #333;
            padding: 2rem 0; /* 確保長清單在手機上有上下留白 */
        }

        /* 容器卡片樣式 */
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px; /* 稍微加寬以容納較長的歌名 */
            text-align: center;
        }

        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #4a4a4a;
            letter-spacing: 1px;
        }

        /* 清單與連結樣式 */
        .link-list {
            list-style: none;
        }

        .link-item {
            margin-bottom: 0.8rem;
        }

        .link-item:last-child {
            margin-bottom: 0;
        }

        .link-item a {
            display: block;
            padding: 0.8rem 1.2rem;
            color: #5a67d8;
            text-decoration: none;
            font-weight: 500;
            background-color: #fff;
            border: 1px solid rgba(90, 103, 216, 0.2);
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            text-align: left; /* 歌單靠左對齊比較整齊美觀 */
        }

        /* 滑鼠懸停動畫效果 */
        .link-item a:hover {
            color: #fff;
            background-color: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(90, 103, 216, 0.15);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>消えない花火</h2>
        <ul class="link-list">
            <li class="link-item">

            </li>
            <li class="link-item">

            </li>

            </li>
            <li class="link-item">

            </li>

            </li>
            <li class="link-item">

            </li>							
        </ul>
		<a href="../">Back</a>
    </div>

</body>
</html>
